# iGameGod paket hatti: her push/PR'de otomatik derle + test et.
# 'v*' tag'lerinde GitHub Release olusturur.
#
# Isler:
#   paketle  Ubuntu'da deb hatti: make all (ac, derle x2, dogrula, test) + make repo
#   tweak    macOS + Theos ile companion tweak'i derle (rootful + rootless)
#   release  tag push'unda derlenen deb'leri Release'e ekler
#
# Notlar:
# - Ubuntu adiminda ek paket kurulumu gerekmez; dpkg-deb/ar/tar/xz/
#   bzip2/python3/make/git onceden kurulu gelir.
# - macOS adiminda install-theos betigi bilerek KULLANILMAZ: icindeki
#   yamali-SDK indirmesi (install-sdk) CI'da kirilgan (exit 8). Tweak
#   yalnizca genel UIKit API'leri kullandigindan Xcode SDK'lari yeterli;
#   Theos dogrudan klonlanir.

name: Derle ve Test Et

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paketle:
    name: Deb hatti (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Surum bilgisi
        run: cat VERSION

      - name: Ac, derle, dogrula, test et
        run: make all

      - name: APT deposu uret
        run: make repo

      - name: Deb'leri yukle
        uses: actions/upload-artifact@v4
        with:
          name: igg-debs
          path: build/*.deb
          if-no-files-found: error

      - name: APT deposunu yukle
        uses: actions/upload-artifact@v4
        with:
          name: apt-repo
          path: build/repo/
          if-no-files-found: error

  tweak:
    name: Companion tweak (macOS + Theos)
    runs-on: macos-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Xcode bilgisi
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Theos bagimliliklari
        run: brew install ldid xz

      - name: Theos klonla
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          test -f "$HOME/theos/makefiles/common.mk"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Tweak'i derle (rootful)
        run: |
          cd tweak
          TWEEK_VER="$(awk -F': *' '/^Version:/ {print $2}' control)"
          make package
          mv packages/*.deb "packages/com.example.iggcompanion_${TWEEK_VER}_iphoneos-arm.rootful.deb"
          ls -la packages/

      - name: Tweak'i derle (rootless)
        run: |
          cd tweak
          sed -i '' 's/^Architecture:.*/Architecture: iphoneos-arm64/' control
          grep '^Architecture:' control
          TWEEK_VER="$(awk -F': *' '/^Version:/ {print $2}' control)"
          THEOS_PACKAGE_SCHEME=rootless make package
          mv packages/com.example.iggcompanion_*_iphoneos-arm64.deb "packages/com.example.iggcompanion_${TWEEK_VER}_iphoneos-arm64.rootless.deb"
          ls -la packages/

      - name: Tweak deb'lerini yukle
        uses: actions/upload-artifact@v4
        with:
          name: igg-tweak
          path: tweak/packages/*.deb
          if-no-files-found: error

  birlestir:
    name: Tum-bir-arada deb (Ubuntu)
    needs: [paketle, tweak]
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Deb'leri indir
        uses: actions/download-artifact@v4
        with:
          name: igg-debs
          path: dl/igg

      - name: Tweak deb'lerini indir
        uses: actions/download-artifact@v4
        with:
          name: igg-tweak
          path: dl/tweak

      - name: Birlestir (rootful + rootless)
        run: |
          mkdir -p bundle-out
          ./scripts/bundle-companion.sh --igg dl/igg/com.gamegod.igg_*_iphoneos-arm.deb --tweak dl/tweak/*_iphoneos-arm.rootful.deb --output bundle-out/
          ./scripts/bundle-companion.sh --igg dl/igg/com.gamegod.igg_*_iphoneos-arm64.deb --tweak dl/tweak/*_iphoneos-arm64.rootless.deb --output bundle-out/
          ls -la bundle-out/

      - name: Birlesik deb'leri dogrula
        run: ./scripts/verify.sh bundle-out/*.deb

      - name: Birlesik deb'leri yukle
        uses: actions/upload-artifact@v4
        with:
          name: igg-debs-bundled
          path: bundle-out/
          if-no-files-found: error

  release:
    name: GitHub Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [paketle, tweak, birlestir]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Artifact'leri indir
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Release olustur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          ls -la release-files
          gh release create "$TAG" release-files/*.deb \
            --title "$TAG" \
            --generate-notes
