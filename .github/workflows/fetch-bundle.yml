name: Fetch Android bundle

# Pulls a large Android bundle into this repo from a source that a CI runner can
# reach but the agent sandbox cannot (the sandbox caps workspace files at 100 MiB;
# the World Soccer Champs bundle is 237,511,212 bytes).
#
# Two ways to trigger it:
#
#   1. Actions tab -> "Fetch Android bundle" -> "Run workflow"
#      gh workflow run fetch-bundle.yml -f source='<drive link or id>'
#      (needs the actions:write scope; the agent's GitHub token gets HTTP 403)
#
#   2. Edit apk/REQUEST and get it onto main. Merging a PR produces a push to
#      main, which runs this workflow with the values from that file. This is
#      the path the agent can use.
#
# For a Drive source the file must be readable by "anyone with the link",
# because the runner authenticates as nobody.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Drive link or bare Drive file ID (source_kind=drive), or any direct download URL (source_kind=url)"
        required: true
      source_kind:
        description: "What the 'source' value is"
        type: choice
        options: [drive, url]
        default: drive
      filename:
        description: "Name to store it as under apk/"
        required: false
        default: "WorldSoccerChamps.xapk"
      expected_md5:
        description: "Expected MD5 of the bundle (leave empty to skip the check)"
        required: false
        default: "6a2db1ec852c44ab0abf958835803a94"
      commit:
        description: "Commit the bundle into this repo via Git LFS"
        type: boolean
        required: false
        default: true
      upload_artifact:
        description: "Also upload as a workflow artifact (consumes Actions storage quota)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths: ['apk/REQUEST']

permissions:
  contents: write

concurrency:
  group: fetch-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Resolve request
        id: cfg
        run: |
          set -euo pipefail
          src="${{ inputs.source }}"
          kind="${{ inputs.source_kind }}"
          name="${{ inputs.filename }}"
          md5="${{ inputs.expected_md5 }}"
          commit="${{ inputs.commit }}"
          artifact="${{ inputs.upload_artifact }}"
          # A push event carries no inputs, so fall back to the key=value lines in
          # apk/REQUEST. Explicit workflow_dispatch inputs always win.
          if [ -z "$src" ] && [ -f apk/REQUEST ]; then
            get() { sed -n "s/^$1=//p" apk/REQUEST | head -1 | tr -d '\r'; }
            src="$(get source)"
            kind="$(get source_kind)"
            name="$(get filename)"
            md5="$(get expected_md5)"
            commit="$(get commit)"
            artifact="$(get upload_artifact)"
            echo "using apk/REQUEST"
          fi
          kind="${kind:-drive}"
          name="${name:-WorldSoccerChamps.xapk}"
          commit="${commit:-true}"
          artifact="${artifact:-false}"
          if [ -z "$src" ]; then
            echo "::error::no source. Pass -f source=... or set source= in apk/REQUEST"
            exit 1
          fi
          {
            echo "src=$src"
            echo "kind=$kind"
            echo "name=$name"
            echo "md5=$md5"
            echo "commit=$commit"
            echo "artifact=$artifact"
            echo "out=apk/$name"
          } >> "$GITHUB_OUTPUT"
          echo "source=$src kind=$kind filename=$name commit=$commit artifact=$artifact"

      - name: Download the bundle
        env:
          SRC: ${{ steps.cfg.outputs.src }}
          KIND: ${{ steps.cfg.outputs.kind }}
          OUT: ${{ steps.cfg.outputs.out }}
        run: |
          set -euo pipefail
          mkdir -p apk
          if [ "$KIND" = "drive" ]; then
            python3 -m pip install --quiet --disable-pip-version-check gdown
            if printf '%s' "$SRC" | grep -Eq '^[A-Za-z0-9_-]{20,}$'; then
              gdown --id "$SRC" -O "$OUT"
            else
              gdown --fuzzy "$SRC" -O "$OUT"
            fi
          else
            curl -fL --retry 3 --retry-delay 2 -C - -o "$OUT" "$SRC"
          fi
          ls -l "$OUT"

      - name: Verify the bundle
        env:
          OUT: ${{ steps.cfg.outputs.out }}
        run: |
          set -euo pipefail
          size="$(stat -c %s "$OUT")"
          md5="$(md5sum "$OUT" | cut -d' ' -f1)"
          echo "size: $size bytes"
          echo "md5:  $md5"
          expected="${{ steps.cfg.outputs.md5 }}"
          if [ -n "$expected" ] && [ "$md5" != "$expected" ]; then
            echo "::error::MD5 mismatch: got $md5, expected $expected"
            exit 1
          fi
          # A valid XAPK is a ZIP; unzip -t fails on a truncated or HTML error page.
          unzip -tq "$OUT"
          echo "--- archive contents ---"
          unzip -l "$OUT" | sed -n '1,30p'
          # Path is derived from $OUT (not from an expression) so this step can be
          # run and tested outside Actions.
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Commit via Git LFS
        if: steps.cfg.outputs.commit == 'true'
        env:
          NAME: ${{ steps.cfg.outputs.name }}
        run: |
          set -euo pipefail
          # .gitattributes already routes *.xapk/*.apk/*.aab/*.obb through LFS.
          git lfs install --local
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes apk/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git lfs status
          git commit -m "Add $NAME bundle"
          git push

      - name: Upload as workflow artifact
        if: steps.cfg.outputs.artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: apk/
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          OUT: ${{ steps.cfg.outputs.out }}
        run: |
          {
            echo "### Bundle"
            echo "| | |"
            echo "|---|---|"
            echo "| file | \`${{ steps.cfg.outputs.name }}\` |"
            if [ -f "$OUT" ]; then
              echo "| size | $(stat -c %s "$OUT") bytes |"
              echo "| md5 | \`$(md5sum "$OUT" | cut -d' ' -f1)\` |"
              echo "| sha256 | \`$(sha256sum "$OUT" | cut -d' ' -f1)\` |"
            else
              echo "| status | download failed |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
